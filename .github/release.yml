# Categories for GitHub-generated release notes (used by gh release create --generate-notes).
changelog:
  exclude:
    labels: ["ignore-for-release"]
  categories:
    - title: Features
      labels: ["feature", "enhancement"]
    - title: Fixes
      labels: ["bug", "fix"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
